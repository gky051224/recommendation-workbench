[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gky-recommendation-workbench"
version = "0.1.0"
description = "Dependency-free, explainable recommendation experiments with held-out evaluation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reclab = "reclab.__main__:main"

[tool.setuptools.packages.find]
include = ["reclab*"]
